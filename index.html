<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Sai Sriyan Nakka" />
    <meta name="description" content="A simple Notepad Web App!" />
    <link rel="shortcut icon" href="favicon.png" type="image/png" />
    <link rel="manifest" href="manifest.json" />
    <script src="marked.min.js"></script>
    <title>Web Notepad</title>
    <style>
      @font-face {
        font-family: "EditorFont";
        src: url("fonts/CascadiaMono-Regular.woff2") format("woff2");
      }
      @font-face {
        font-family: "MainFont";
        src: url("fonts/Boogaloo-Regular.woff2") format("woff2");
      }

      html {
        color-scheme: light dark;
      }
      .icon {
        width: 40px;
        margin: 0.5rem;
        background-color: hsla(0, 0%, 0%, 0.8);
        transition: all 0.2s ease-in-out;
        border-radius: 15px;
      }
      .icon:hover {
        cursor: pointer;
        transform: scale(1.25);
      }
      body {
        font-size: 62.5%;
        background-color: light-dark(white, black);
        color: light-dark(black, white);
        font-size: 1.6rem;
        font-family: "MainFont", sans-serif, serif;
      }
      main {
        display: flex;
        flex-direction: column;
        font-family: "MainFont", monospace;
        flex: 1;
        min-height: 0;
      }
      footer {
        font-size: 1.25rem;
        padding: 0.5rem;
      }
      footer a {
        text-decoration: none;
      }
      a,
      button {
        cursor: pointer;
      }
      #fullContent {
        width: 100%;
        min-height: 100dvh;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      h1 {
        font-size: 2.5rem;
        margin-top: 5px;
        margin-bottom: 10px;
      }
      header p {
        font-size: 1.4rem;
        margin-top: 3px;
        margin-bottom: 3px;
      }
      #editor {
        width: 100%;
        box-sizing: border-box;
        flex: 1;
        min-height: 0;
        font-size: 1.6rem;
        margin-top: 5px;
        font-family: EditorFont, monospace;
        padding: 10px;
      }
      #infoBar {
        display: flex;
        gap: 5px;
        align-items: flex-start;
        min-height: 50px;
        font-size: clamp(0.8rem, 2vw, 1.3rem);
        white-space: nowrap;
      }
      #infoBar p {
        margin: 5px 0;
        border-right: 2px solid light-dark(black, white);
        padding-right: 10px;
        padding-left: 5px;
      }
      #infoBar p:is(:last-child) {
        border-right: none;
      }
      #preview {
        width: 99%;
        height: 100%;
        overflow-y: auto;
        font-size: 1.6rem;
        border: 2px solid light-dark(black, white);
      }
      #fileNameInput {
        font-size: 1.3rem;
        min-width: 350px;
        padding: 5px;
        font-family: EditorFont, monospace;
        border: 2px solid light-dark(black, white);
        border-radius: 7px;
      }
      #options button {
        font-size: clamp(0.9rem, 2vw, 1.3rem);
        padding: 5px;
        font-family: EditorFont, monospace;
        margin: 10px 5px;
        border-radius: 5px;
        border: 2px solid light-dark(black, white);
        transition: background 0.15s ease-out;
      }
      #options button:hover {
        background-color: light-dark(hsl(0, 0%, 75%), hsl(0, 0%, 25%));
        transition: background 0.1s ease-out;
      }
      #editor,
      #options button,
      #fileNameInput {
        background-color: light-dark(hsl(0, 0%, 90%), hsl(0, 0%, 10%));
      }
      #spellCheckLabel {
        margin: 5px 0;
      }
      @media (max-width: 600px) {
        #infoBar {
          min-height: 45px;
        }
        #spellCheckLabel {
          margin: 0;
        }
      }
    </style>
  </head>
  <body>
    <script src="script.js" defer></script>
    <div id="fullContent">
      <header style="text-align: center">
        <h1>
          Web Notepad
          <sub style="font-size: 0.9rem; font-weight: normal"
            >A simple Notepad Web App</sub
          >
        </h1>
      </header>
      <main style="flex: 1">
        <div id="topBar">
          <input
            type="text"
            id="fileNameInput"
            value="untitled.txt"
            autocomplete="off"
          />
          <div id="options">
            <button id="openBtn">Open File</button>
            <button id="previewBtn">Preview Markdown</button>
            <button id="saveBtn">Save File</button>
          </div>
        </div>
        <textarea
          id="editor"
          spellcheck="false"
          placeholder="Start typing here..."
        ></textarea>
      </main>
      <div id="infoBar">
        <p style="margin: 5px 0"><span id="chars">0</span> Chars</p>
        <p><span id="lines">0</span> Total Line(s)</p>
        <p>
          Line: <span id="line">0</span>, Column: <span id="column">0</span>
        </p>
        <label id="spellCheckLabel">
          <input type="checkbox" name="spellCheck" id="spellCheck" />
          <span> Spell Check </span>
        </label>
      </div>
    </div>
    <input type="file" id="fileOpener" hidden />
    <footer>
      <a href="https://github.com/Sriyan-Nakka" target="_blank">
        <svg
          class="icon github"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
        >
          <path
            fill="white"
            d="M12 1A10.89 10.89 0 0 0 1 11.77A10.79 10.79 0 0 0 8.52 22c.55.1.75-.23.75-.52v-1.83c-3.06.65-3.71-1.44-3.71-1.44a2.86 2.86 0 0 0-1.22-1.58c-1-.66.08-.65.08-.65a2.31 2.31 0 0 1 1.68 1.11a2.37 2.37 0 0 0 3.2.89a2.33 2.33 0 0 1 .7-1.44c-2.44-.27-5-1.19-5-5.32a4.15 4.15 0 0 1 1.11-2.91a3.78 3.78 0 0 1 .11-2.84s.93-.29 3 1.1a10.7 10.7 0 0 1 5.5 0c2.1-1.39 3-1.1 3-1.1a3.78 3.78 0 0 1 .11 2.84A4.15 4.15 0 0 1 19 11.2c0 4.14-2.58 5.05-5 5.32a2.5 2.5 0 0 1 .75 2v2.95c0 .35.2.63.75.52A10.8 10.8 0 0 0 23 11.77A10.89 10.89 0 0 0 12 1"
          />
        </svg>
      </a>
      <a href="https://sriyan-blogs.blogspot.com/">
        <svg
          class="icon blogger"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 32 32"
        >
          <path
            fill="white"
            d="M13 7a6 6 0 0 0-6 6v7a6 6 0 0 0 6 6h7a6 6 0 0 0 6-6v-5a1 1 0 0 0-1-1h-1a1 1 0 0 1-1-1a6 6 0 0 0-6-6zm0 5h4c.55 0 1 .45 1 1s-.45 1-1 1h-4c-.55 0-1-.45-1-1s.45-1 1-1m0 7h7c.55 0 1 .45 1 1s-.45 1-1 1h-7c-.55 0-1-.45-1-1s.45-1 1-1"
          />
        </svg>
      </a>

    </footer>
  </body>
</html>
